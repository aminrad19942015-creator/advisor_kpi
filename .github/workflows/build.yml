name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            {
              echo "## Next.js build failure"
              echo '~~~text'
              tail -n 120 build.log
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
        env:
          TURSO_DATABASE_URL: libsql://placeholder.invalid
          TURSO_AUTH_TOKEN: build-placeholder
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: build.log
          if-no-files-found: ignore
