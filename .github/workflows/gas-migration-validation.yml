name: Advisor KPI validation

on:
  push:
    branches:
      - main
      - gas-dashboard-v1
      - monthly-report-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Next.js production build
        run: npm run build

      - name: Parse GAS server JavaScript
        run: |
          cp gas/Code.gs /tmp/advisor-gas-code.js
          node --check /tmp/advisor-gas-code.js
          cp gas-relay/Code.gs /tmp/advisor-gas-relay.js
          node --check /tmp/advisor-gas-relay.js

      - name: Verify Google transport authentication and queue lifecycle
        run: node --test connector/test-google-relay-protocol.js connector/test-google-relay-server.js connector/test-dashboard-read-cache.js

      - name: Parse local runtime and publishing tools
        run: |
          node --check ops/local-runtime.cjs
          node --check ops/stage-google-project.cjs
          node --check ops/configure-google-runtime.cjs
          node --check ops/verify-google-postgres.cjs

      - name: Parse GAS browser JavaScript
        run: |
          sed '1d;$d' gas/Scripts.html > /tmp/advisor-gas-scripts.js
          node --check /tmp/advisor-gas-scripts.js
          sed '1d;$d' gas/RpcClient.html > /tmp/advisor-gas-rpc-client.js
          node --check /tmp/advisor-gas-rpc-client.js

      - name: Parse GAS admin browser JavaScript
        run: |
          sed '1d;$d' gas/AdminScripts.html > /tmp/advisor-gas-admin-scripts.js
          node --check /tmp/advisor-gas-admin-scripts.js

      - name: Validate GAS manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('gas/appsscript.json','utf8')); console.log('GAS manifest JSON OK')"

      - name: Validate previous-month connector
        run: |
          node --check connector/persian-month.js
          node --check connector/report-month-sync.js
          node connector/test-persian-month.js
