<style>
[hidden]{display:none!important}
#loginView[hidden],#adminView[hidden]{display:none!important}

:root{--bg:#081522;--panel:#10243a;--panel2:#0c1d30;--line:#23425f;--text:#eef6fb;--muted:#8fa6bb;--primary:#39d3c2;--blue:#67b8ff;--gold:#f0b95a;--danger:#ff7e98}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',sans-serif}button,input,select,textarea{font-family:inherit}
button{border:0;border-radius:9px;background:#1d8f86;color:#fff;padding:9px 13px;cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#173653;border:1px solid #2c5675}button.danger{background:#6a3042}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(410px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.3);text-align:center}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#3fe0cd,#4b8cff);display:grid;place-items:center;margin:0 auto 15px;font-weight:900;font-size:22px}.login-card h1{font-size:20px;margin:0 0 5px}.login-card p{color:var(--muted);font-size:12px;margin:0 0 18px}.login-card input{width:100%;height:43px;margin-bottom:10px}.login-card button{width:100%;height:43px}.msg{margin-top:10px;color:#ffc0ce;font-size:12px}
input,select,textarea{background:#0a1b2d;color:var(--text);border:1px solid #294963;border-radius:8px;padding:8px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:#42cfc0}.admin-shell{width:min(1680px,calc(100% - 32px));margin:0 auto;padding:24px 0 60px}.admin-head,.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.admin-head{padding:4px 2px 18px}.admin-head h1{margin:0;font-size:26px}.admin-head p{margin:2px 0 0;color:var(--muted);font-size:12px}.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.section-head h2{margin:3px 0 0;font-size:18px}.eyebrow{font-size:9px;letter-spacing:1.5px;color:var(--primary)}.notice{border:1px solid #6b5b24;background:#352d16;color:#ffe4a0;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px}.notice.ok{border-color:#276b61;background:#10382f;color:#b9fff1}.notice.bad{border-color:#76364a;background:#3b1c27;color:#ffd2dc}
.stats-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:22px;margin-top:4px}.sync-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.sync-item{background:#0b1c2d;border-radius:10px;padding:10px;border:1px solid #1d394f;font-size:11px}.sync-item b{display:block;margin-bottom:3px}.commands{margin-top:12px}.command-row{display:grid;grid-template-columns:70px 1fr 110px 180px;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:10.5px;color:#bfd0df}
.search{min-width:250px}.add-grid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:8px;margin:14px 0}.table-wrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:11px}.table-wrap table{border-collapse:collapse;width:100%;min-width:1320px}.table-wrap th{position:sticky;top:0;background:#18344f;z-index:2;padding:9px;color:#a9bfd2;font-size:10px}.table-wrap td{padding:5px;border-top:1px solid rgba(255,255,255,.05)}.table-wrap td input{width:100%;min-width:105px;font-size:10.5px;padding:6px}.dirty-row td{background:rgba(57,211,194,.04)}.muted{color:var(--muted);font-size:11px;margin-top:9px}
.schedule-box{display:flex;gap:9px;flex-wrap:wrap;padding:10px 12px;background:#0b1d30;border:1px solid var(--line);border-radius:10px;margin:14px 0;font-size:11px}.config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.config-card{background:#0b1c2d;border:1px solid var(--line);border-radius:12px;padding:13px}.config-card h3{margin:0 0 10px;font-size:14px;color:#cfeeff}.config-card label{display:block;color:#91abc1;font-size:10px;margin:9px 0 4px}.config-card select,.config-card textarea{width:100%}.config-card textarea{min-height:92px;resize:vertical}.tech{opacity:.65}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr)}.sync-grid,.config-grid{grid-template-columns:1fr}.add-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr)}.add-grid{grid-template-columns:1fr}.search{min-width:0;width:100%}}
</style>
