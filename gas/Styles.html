/* v7 — Open leads filters: exactly 2 rows × 5 filters on desktop */
#leadsView .filters-row,
#openLeadsView .filters-row,
[data-view="leads"] .filters-row,
.leads-view .filters-row {
  display: grid !important;
  grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
  grid-auto-flow: row !important;
  gap: 10px 12px !important;
  overflow: visible !important;
  align-items: start !important;
}
#leadsView .filter-item,
#openLeadsView .filter-item,
[data-view="leads"] .filter-item,
.leads-view .filter-item {
  min-width: 0 !important;
  width: 100% !important;
}
@media (max-width: 1100px) {
  #leadsView .filters-row,
  #openLeadsView .filters-row,
  [data-view="leads"] .filters-row,
  .leads-view .filters-row {
    grid-template-columns: repeat(2, minmax(180px, 1fr)) !important;
  }
}

.open-leads-filters {display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;grid-auto-flow:row!important;gap:10px 12px!important;overflow:visible!important;align-items:start!important}
.open-leads-filters>*{min-width:0!important;width:100%!important}
@media(max-width:1100px){.open-leads-filters{grid-template-columns:repeat(2,minmax(180px,1fr))!important}}
