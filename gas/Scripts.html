 google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);
}));

const fa=v=>Number(v||0).toLocaleString('fa-IR');
const safe=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const fmt=v=>{const d=new Date(v);return isNaN(d)?'—':d.toLocaleDateString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'})};
const norm=v=>String(v??'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\u200f]/g,' ').replace(/\s+/g,' ').trim();

const SNAPSHOT_PREFIX='advisor-kpi-summary-v1:';
const SNAPSHOT_MAX_AGE_MS=14*24*60*60*1000;
const TEHRAN_OFFSET_MS=210*60*1000;

function snapshotWrite(key,payload){
 try{
  localStorage.setItem(SNAPSHOT_PREFIX+key,JSON.stringify({savedAt:new Date().toISOString(),payload}));
 }catch(e){console.warn('Snapshot write skipped',e)}
}
function snapshotRead(key){
 try{
  const raw=localStorage.getItem(SNAPSHOT_PREFIX+key);
  if(!raw)return null;
  const parsed=JSON.parse(raw);
  const saved=Date.parse(parsed?.savedAt||'');
  if(!Number.isFinite(saved)||Date.now()-saved>SNAPSHOT_MAX_AGE_MS)return null;
  return parsed;
 }catch(e){return null}
}

 return !!(data&&typeof data==='object'&&data.team&&typeof data.team==='object'&&
   data.team.kpis&&Array.isArray(data.team.rows)&&data.open&&typeof data.open==='object'&&
   data.open.kpis&&data.teamFilters&&data.openFilters);
}
function validPeriodPayload(payload){
 return !!(payload&&typeof payload==='object'&&payload.summary&&typeof payload.summary==='object'&&

}
function healthBanner(kind,message,meta=''){
 const el=$('dataHealthBanner');if(!el)return;
 if(!message){el.hidden=true;el.className='data-health-banner';el.innerHTML='';return}
 el.hidden=false;el.className='data-health-banner '+kind;
 el.innerHTML='<b>'+safe(message)+'</b>'+(meta?'<span class="health-meta">'+safe(meta)+'</span>':'');
}
function latestExpectedSync(kind,nowMs=Date.now()){
 const localNow=new Date(nowMs+TEHRAN_OFFSET_MS);
 const todayLocalMidnight=Date.UTC(localNow.getUTCFullYear(),localNow.getUTCMonth(),localNow.getUTCDate());
 const currentMinutes=localNow.getUTCHours()*60+localNow.getUTCMinutes();
 const schedule=kind==='open'?[7*60,9*60,12*60,15*60]:[7*60+30];
 const grace=60;
 for(let back=0;back<8;back++){
  const localMidnight=todayLocalMidnight-back*86400000;
  const d=new Date(localMidnight);
  if(d.getUTCDay()===5)continue; // Friday
  const maxMinutes=back===0?currentMinutes-grace:24*60;
  const eligible=schedule.filter(x=>x<=maxMinutes);
  if(!eligible.length)continue;
  return localMidnight+eligible[eligible.length-1]*60000-TEHRAN_OFFSET_MS;
 }
 return null;
}
function freshnessWarnings(meta){
 const out=[];
 const checks=[
  ['Open Leads',meta?.crmShadowLastSyncAt,'open'],
  ['Activity',meta?.crmActivityLastSyncAt,'activity']
 ];
 for(const [label,raw,kind] of checks){
  const expected=latestExpectedSync(kind);
  const actual=Date.parse(raw||'');
  if(expected&&(!Number.isFinite(actual)||actual<expected)){
   const exp=new Date(expected).toLocaleString('fa-IR');
   const got=Number.isFinite(actual)?new Date(actual).toLocaleString('fa-IR'):'بدون ثبت';
   out.push(label+' عقب است؛ آخرین: '+got+' | موعد مورد انتظار: '+exp);
  }
 }
 return out;
}
function updateFreshnessBanner(meta){
 const warnings=freshnessWarnings(meta||{});
 if(warnings.length)healthBanner('warning','هشدار تازگی داده',warnings.join(' — '));
 else healthBanner('','','');
}

function donut(entries){
 const rows=(entries||[]).filter(x=>Number(x[1])>0);
 if(!rows.length)return '<div class="empty">داده‌ای برای نمودار وجود ندارد.</div>';
 const total=rows.reduce((s,x)=>s+Number(x[1]||0),0),r=72,cx=100,cy=100,sw=28,C=2*Math.PI*r;
 let off=0;
 const segs=rows.map(([label,value],i)=>{
  const n=Number(value||0),len=n/total*C,pct=n/total*100;
  const html=`<circle class="donut-segment" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--donut-${i%8})" stroke-width="${sw}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" data-v="${safe(label)}" data-count="${n}" data-pct="${pct.toFixed(1)}"><title>${safe(label)}: ${fa(n)} (${pct.toFixed(1)}٪)</title></circle>`;
  off+=len;return html;
 }).join('');

 return `<div class="donut-wrap"><div class="donut-chart"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${sw}"/>${segs}</svg><div class="donut-center"><b>${fa(total)}</b><span>سرنخ</span></div></div><div class="donut-legend">${legend}</div></div>`;
}
function bindDonut(root,handler){

function rangeText(s){if(!s||!s.days||!s.days.length)return '—';return s.days.length===1?fmt(s.days[0]):fmt(s.days[0])+' تا '+fmt(s.days[s.days.length-1])}
function syncTimeText(v){

const TREND_METRICS={

function smoothPath(points){
 if(!points.length)return '';
 if(points.length===1)return `M ${points[0][0]} ${points[0][1]}`;
 let d=`M ${points[0][0]} ${points[0][1]}`;
 for(let i=0;i<points.length-1;i++){
  const p0=points[i-1]||points[i],p1=points[i],p2=points[i+1],p3=points[i+2]||p2;
  const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
  const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
  d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
 }
 return d;
}
function trendChart(rows,metric='total',unitRows=[],roleTrend={},roleCounts={},perPersonMode=false){
 if(!rows||!rows.length)return '<div class="empty">داده‌ای برای نمودار وجود ندارد.</div>';
 const meta=TREND_METRICS[metric]||TREND_METRICS.total;
 const W=1100,H=330,p={l:48,r:24,t:34,b:52},iw=W-p.l-p.r,ih=H-p.t-p.b;
 let benchmarks=[];
 if(perPersonMode){
  const defs=[
   {key:'guide',label:'میانگین راهنما',color:'#f6c85f'},
   {key:'advisor',label:'میانگین مشاور',color:'#63b3ff'},
   {key:'senior',label:'میانگین مشاور ارشد و سرتیم',color:'#b08cff'}
  ];
  benchmarks=defs.map(d=>{const rr=roleTrend[d.key]||[],daily=rr.length?rr.reduce((s,r)=>s+Number(r[metric]||0),0)/rr.length:0,count=Number(roleCounts[d.key]||0);return {...d,value:count?daily/count:0,count}});
 }else{
  const defs=[
   {key:'guide',label:'میانگین کل راهنماها',color:'#f6c85f'},
   {key:'advisor',label:'میانگین کل مشاوران',color:'#63b3ff'},
   {key:'senior',label:'میانگین کل مشاور ارشد و سرتیم',color:'#b08cff'}
  ];
  benchmarks=defs.map(d=>{const rr=roleTrend[d.key]||[],daily=rr.length?rr.reduce((s,r)=>s+Number(r[metric]||0),0)/rr.length:0,count=Number(roleCounts[d.key]||0);return {...d,value:daily,count}});
 }
 let max=Math.max(1,...benchmarks.map(x=>x.value),...rows.map(r=>Number(r[metric]||0)));max*=1.08;
 const x=i=>p.l+(rows.length===1?iw/2:i*iw/(rows.length-1)),y=v=>p.t+ih-(Number(v)||0)/max*ih;
 let grid='';for(let i=0;i<=4;i++){const val=max*i/4,yy=y(val);grid+=`<line x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}" class="chart-gridline"/><text x="${p.l-8}" y="${yy+4}" text-anchor="end" class="chart-axis">${fa(Math.round(val))}</text>`}
 const pts=rows.map((r,i)=>[x(i),y(r[metric])]),path=smoothPath(pts);
 const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-18}" text-anchor="middle" class="chart-axis">${fmt(r.day)}</text>`).join('');
 const band=rows.length>1?iw/(rows.length-1):iw;
 const hit=rows.map((r,i)=>{const left=Math.max(p.l,x(i)-band/2),right=Math.min(W-p.r,x(i)+band/2);return `<rect class="trend-hit" x="${left}" y="${p.t}" width="${Math.max(12,right-left)}" height="${ih}" fill="transparent" data-i="${i}"/>`}).join('');
 const benchmarkLines=benchmarks.filter(a=>a.count>0).map(a=>`<line x1="${p.l}" x2="${W-p.r}" y1="${y(a.value)}" y2="${y(a.value)}" stroke="${a.color}" stroke-width="2" stroke-dasharray="9 7"/>`).join('');
 const legend=benchmarks.filter(a=>a.count>0).map(a=>`<span><i class="dash" style="border-color:${a.color}"></i>${a.label}: <b>${fa(a.value.toFixed(1))}</b></span>`).join('');
 return `<div class="trend-chart-wrap" data-metric="${metric}" data-benchmarks='${safe(JSON.stringify(benchmarks))}' data-rows='${safe(JSON.stringify(rows))}' data-label="${safe(meta.label)}">
  <div class="trend-legend"><span><i style="background:${meta.line}"></i>${meta.label}</span>${legend}</div>
  <div class="chart-stage trend-hover-stage"><div class="chart-tooltip"></div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${benchmarkLines}<path d="${path}" fill="none" stroke="${meta.line}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(([px,py])=>`<circle cx="${px}" cy="${py}" r="4" fill="${meta.line}" />`).join('')}${labels}${hit}</svg></div>
 </div>`;
}
function bindTrendChartHover(root=document){
 root.querySelectorAll('.trend-hover-stage').forEach(stage=>{
  const wrap=stage.closest('.trend-chart-wrap');if(!wrap)return;
  let rows=[];try{rows=JSON.parse(wrap.dataset.rows||'[]')}catch(e){}
  let benchmarks=[];try{benchmarks=JSON.parse(wrap.dataset.benchmarks||'[]')}catch(e){}const metric=wrap.dataset.metric||'total',label=wrap.dataset.label||'',tip=stage.querySelector('.chart-tooltip');if(!tip)return;
  stage.querySelectorAll('.trend-hit').forEach(hit=>{
   hit.onmouseenter=hit.onmousemove=e=>{const r=rows[Number(hit.dataset.i)]||{},benchHtml=benchmarks.filter(x=>x.count>0).map(x=>`<span>${safe(x.label)}</span><b>${fa(Number(x.value||0).toFixed(1))}</b>`).join('');tip.innerHTML=`<div class="ct-date">${fmt(r.day)}</div><div class="ct-grid"><span>${safe(label)}</span><b>${fa(r[metric])}</b>${benchHtml}</div>`;const rect=stage.getBoundingClientRect();tip.style.display='block';tip.style.left=Math.min(rect.width-210,Math.max(8,e.clientX-rect.left-90))+'px';tip.style.top='52px';};
   hit.onmouseleave=()=>{tip.style.display='none'};
  });
 });
}

const filterState={
  team:{search:'',teamLead:[],seniorLead:[],team:[],gender:[],role:[],businessUnit:[]},
  open:{advisor:[],seniorLead:[],role:[],team:[],personUnit:[],age:'',leadType:['حقیقی'],nextCallReason:[],customerRank:[],campaign:['Ayar','LeadAdvice'],source:[],lastStatus:[]},
  daily:{advisor:[],teamLead:[],seniorLead:[],team:[],role:[],campaign:[]},
  weekly:{advisor:[],teamLead:[],seniorLead:[],team:[],role:[],campaign:[]},
  monthly:{advisor:[],teamLead:[],seniorLead:[],team:[],role:[],campaign:[]},
  reportMonth:{advisor:[],teamLead:[],seniorLead:[],team:[],role:[],campaign:[]}
};
let filterOptions={team:{},open:{},periodCampaign:{daily:[],weekly:[],monthly:[],reportMonth:[]}};

function syncedTeamOptions(current,mapping){
  const members=(filterOptions.team&&filterOptions.team.members)||[];
  const out={};
  const entries=Object.entries(mapping);
  for(const [stateKey,memberKey] of entries){
    let rows=members;
    for(const [otherStateKey,otherMemberKey] of entries){
      if(otherStateKey===stateKey) continue;
      const selected=Array.isArray(current[otherStateKey])?current[otherStateKey].filter(Boolean):[];
      if(selected.length) rows=rows.filter(r=>selected.includes(r[otherMemberKey]||''));
    }
    let vals=[...new Set(rows.map(r=>r[memberKey]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'fa',{numeric:true}));
    if(stateKey==='seniorLead') vals=[...new Set([...(filterOptions.team?.seniorLead||[]),...vals])].sort((a,b)=>String(a).localeCompare(String(b),'fa',{numeric:true}));
    const selected=Array.isArray(current[stateKey])?current[stateKey].filter(Boolean):[];
    out[stateKey]=[...new Set([...selected,...vals])];
  }
  return out;
}

// Default state is intentionally empty = "همه".
// No filter should be selected automatically on first load.

}
resetAllFilterState();

function optionHtml(vals,selected){
  const chosen=Array.isArray(selected)?selected.filter(Boolean):[];
  const set=new Set(chosen);
  return (vals||[]).map(v=>`<option value="${safe(v)}"${set.has(v)?' selected':''}>${safe(v)}</option>`).join('');
}


function selectedValues(el){return [...el.options].filter(o=>o.selected).map(o=>o.value).filter(Boolean)}

function commitMulti(box){
  if(!box || !box._dirty) return;
  box._dirty=false;
  const sel=$(box.dataset.for);
  if(sel && box._changeHandler) box._changeHandler(selectedValues(sel));
}

function closeMulti(box){
  if(!box) return;
  const wasOpen=box.classList.contains('open');
  box.classList.remove('open');
  if(wasOpen) commitMulti(box);
}

function ensureDropdownMulti(id,onchange){
  const sel=$(id);
  if(!sel || sel.dataset.multiReady==='1') return;

  sel.dataset.multiReady='1';
  sel.multiple=true;
  sel.classList.add('multi-host');

  const box=document.createElement('div');
  box.className='multi';
  box.dataset.for=id;
  box.innerHTML=`
    <button type="button" class="multi-btn">
      <span class="multi-label">همه</span>
      <span class="multi-count"></span>
      <span>⌄</span>
    </button>
    <div class="multi-menu"></div>
  `;
  sel.insertAdjacentElement('afterend',box);

  const btn=box.querySelector('.multi-btn');

  btn.onclick=e=>{
    e.stopPropagation();

    const isOpen=box.classList.contains('open');
    document.querySelectorAll('.multi.open').forEach(x=>{
      if(x!==box) closeMulti(x);
    });

    if(isOpen) closeMulti(box);
    else box.classList.add('open');
  };

  box.querySelector('.multi-menu').onclick=e=>e.stopPropagation();
  box._changeHandler=onchange;
  box._dirty=false;
}

function syncDropdownMulti(id){
  const sel=$(id);
  if(!sel) return;

  const box=sel.nextElementSibling;
  if(!box || !box.classList.contains('multi')) return;

  const menu=box.querySelector('.multi-menu');

  menu.innerHTML=`
    <div class="multi-tools">
      <button type="button" class="multi-tool all">انتخاب همه</button>
      <button type="button" class="multi-tool none">پاک کردن</button>
    </div>
  ` + [...sel.options].map((o,i)=>`
    <label class="multi-option" title="${safe(o.textContent)}">
      <input type="checkbox" data-i="${i}" ${o.selected?'checked':''}>
      <span title="${safe(o.textContent)}">${safe(o.textContent)}</span>
    </label>
  `).join('');

  menu.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.onchange=()=>{
      sel.options[Number(cb.dataset.i)].selected=cb.checked;
      box._dirty=true;
      updateDropdownLabel(id);
    };
  });

  menu.querySelector('.all').onclick=()=>{
    [...sel.options].forEach(o=>o.selected=true);
    box._dirty=true;
    syncDropdownMulti(id);
    box.classList.add('open');
  };

  menu.querySelector('.none').onclick=()=>{
    [...sel.options].forEach(o=>o.selected=false);
    box._dirty=true;
    syncDropdownMulti(id);
    box.classList.add('open');
  };

  updateDropdownLabel(id);
}

function updateDropdownLabel(id){
  const sel=$(id);
  const box=sel?.nextElementSibling;
  if(!sel || !box) return;

  const vals=selectedValues(sel);
  const label=box.querySelector('.multi-label');
  const count=box.querySelector('.multi-count');

  box.classList.toggle('has-selection',vals.length>0);

  if(count) count.textContent=fa(vals.length);

  if(!vals.length){
    label.textContent='همه';
  }else if(vals.length===1){
    label.textContent=vals[0];
  }else{
    label.textContent=`${fa(vals.length)} مورد انتخاب شده`;
  }
}

function simpleMulti(id,vals,selected,onchange){
  setTimeout(()=>{
    const el=$(id);
    if(!el) return;

    const chosen=Array.isArray(selected)?selected.filter(Boolean):[];
    el.innerHTML=optionHtml(vals,chosen);
    el.multiple=true;

    if(!chosen.length){
      [...el.options].forEach(o=>o.selected=false);
      el.selectedIndex=-1;
    }else{
      const set=new Set(chosen);
      [...el.options].forEach(o=>o.selected=set.has(o.value));
    }

    ensureDropdownMulti(id,onchange);

    const box=el.nextElementSibling;
    if(box && box.classList.contains('multi')) box._changeHandler=onchange;

    syncDropdownMulti(id);
  },0);
}

document.addEventListener('click',()=>{
  document.querySelectorAll('.multi.open').forEach(x=>closeMulti(x));
});
function setPageLoading(pageId,on){
  const el=$(pageId);if(el)el.classList.toggle('filter-loading',on);
}
function pageReadNotice(pageId,info){
 const page=$(pageId);if(!page)return;
 let note=page.querySelector('.read-refresh-note');

function cachedOpenDetailRun(){
 let success=()=>{},failure=()=>{};
 const runner={withSuccessHandler(fn){success=fn;return runner;},withFailureHandler(fn){failure=fn;return runner;}};
 for(const method of ['getOpenLeadDetails','getOpenNearDeadlineDetails'])runner[method]=(...args)=>latestRead('openDetail',method,args,(rows,info)=>{
  success(rows);
  if(info?.refreshing||info?.error)$('openDetailSub').textContent+=info.error?' — نسخهٔ قبلی؛ بروزرسانی ناموفق':' — نسخهٔ قبلی؛ در حال بروزرسانی…';
 },error=>{if(!readRpc.peek(method,args))failure(error);else toast('دریافت نسخهٔ تازه ناموفق بود.');},()=>{});
 return runner;
}

function detailCell(c,v){
 if(v==null||v==='')return '—';
 const key=String(c).toLowerCase();
 const isDate=/(^|_)(date|start|modified|created|closed|resolve|entered|followup|at)($|_)/.test(key)||/(تاریخ|زمان ثبت|زمان بسته|شروع|آخرین تغییر)/.test(String(c));
 if(isDate){
  const d=new Date(v);
  if(!isNaN(d)){
   const hasTime=/\d{1,2}:\d{2}/.test(String(v));
   return hasTime?d.toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'});
  }
 }
 return String(v);
}

function gasExportChunk(tab,dataset,filters,offset,limit){
 return new Promise((resolve,reject)=>{
   google.script.run
    .withFailureHandler(e=>reject(new Error(e?.message||String(e||'خطا در دریافت خروجی'))))
    .withSuccessHandler(rows=>resolve(Array.isArray(rows)?rows:[]))
    .getExportChunk(tab,dataset,filters||{},offset||0,limit||10000);
 });
}

async function fetchAllExportRows(tab,dataset,filters){
 const limit=10000,rows=[];
 let offset=0;
 while(true){
   const chunk=await gasExportChunk(tab,dataset,filters,offset,limit);
   rows.push(...chunk);
   if(chunk.length<limit)break;
   offset+=chunk.length;
   if(offset>300000)throw new Error('حجم خروجی از سقف ایمن عبور کرد.');
 }
 return rows;
}

 'created_date','last_modified_date','next_followup_at',
 'planned_start','start_date','resolve_by','entered_queue',
 'closed_at','modified_on','created_on',
 'createdDate','lastModifiedDate','nextFollowupAt',

]);

function excelPersianDate(value,column){
 if(value===null||value===undefined||value==='')return value;
 if(!EXCEL_DATE_COLUMNS.has(String(column)))return value;
 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return value;
 const raw=String(value);
 const hasTime=/T\d{1,2}:\d{2}|\s\d{1,2}:\d{2}/.test(raw);
 const parts=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{
  timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',
  ...(hasTime?{hour:'2-digit',minute:'2-digit',hour12:false}:{})
 }).formatToParts(d);
 const getPart=type=>parts.find(p=>p.type===type)?.value||'';
 const date=getPart('year')+'/'+getPart('month')+'/'+getPart('day');
 return hasTime?date+' '+getPart('hour')+':'+getPart('minute'):date;
}

function prepareExcelRows(rows){
 return (rows||[]).map(row=>{
  const out={};
  Object.entries(row||{}).forEach(([key,value])=>{out[key]=excelPersianDate(value,key)});
  return out;
 });
}

 });
 return rows.length?rows:[{فیلتر:'وضعیت',مقدار:'بدون فیلتر'}];
}

}

 const btn=document.querySelector(`button[data-export-tab="${tab}"]`);
 if(btn?.disabled)return;
 const original=btn?.textContent||'خروجی اکسل';
 if(btn){btn.disabled=true;btn.textContent='در حال آماده‌سازی...';}
 try{
   toast('در حال آماده‌سازی خروجی اکسل...');
   const XLSX=await loadXlsxModule();
   const wb=XLSX.utils.book_new();
   let filename='advisor-dashboard.xlsx';

   if(tab==='team'){
     const rows=((state.data?.team||{}).rows||[]).map(r=>({
       'نام':r.name||'','کد پرسنلی':r.personnelCode||'','ایمیل':r.email||'','تیم لید':r.teamLead||'',
       'سرتیم':r.seniorLead||'','تیم':r.team||'','جنسیت':r.gender||'','رده':r.role||'','واحد تجاری':r.businessUnit||''
     }));
     appendExportSheet(XLSX,wb,'فهرست افراد',rows);
     appendExportSheet(XLSX,wb,'فیلترها',exportFilterRows(filterState.team||{}));
     filename='team-overview.xlsx';
   }else if(tab==='open'){
     const rows=await fetchAllExportRows('open','open',filterState.open||{});
     appendExportSheet(XLSX,wb,'سرنخ های باز',rows);
     appendExportSheet(XLSX,wb,'فیلترها',exportFilterRows(filterState.open||{}));
     filename='open-leads.xlsx';
   }else if(['daily','weekly','monthly','reportMonth'].includes(tab)){
     const filters=filterState[tab]||{};
     appendExportSheet(XLSX,wb,'خلاصه مشاوران',exportAdvisorRows(state.data?.[tab]?.advisors||[]));
     const specs=[
       ['leads','لیدها'],
       ['opportunities','فرصت ها'],
       ['calls','تماس ها'],
       ['tickets','تیکت ها']
     ];
     for(const [dataset,sheet] of specs){
       toast('در حال دریافت '+sheet+'...');
       const rows=await fetchAllExportRows(tab,dataset,filters);
       appendExportSheet(XLSX,wb,sheet,exportTranslateRows(rows));
     }
     appendExportSheet(XLSX,wb,'فیلترها',exportFilterRows(filters));
      filename=tab==='daily'?'فعالیت دیروز.xlsx':tab==='weekly'?'فعالیت هفته.xlsx':tab==='monthly'?'فعالیت ماهانه.xlsx':'گزارش یک ماهه.xlsx';
   }else{
     throw new Error('تب خروجی نامعتبر است.');
   }

   XLSX.writeFile(wb,filename,{compression:true});
   toast('خروجی اکسل آماده شد.');
 }catch(e){
   console.error(e);
   toast('خطا در خروجی اکسل: '+(e?.message||e||'خطای نامشخص'));
 }finally{
   if(btn){btn.disabled=false;btn.textContent=original;}
 }
}
function showCachedDetail(id,title,method,args){
 const box=$(id);box.style.display='block';
 $(id+'Sub').textContent='در حال دریافت '+title+'…';
 $(id+'Body').innerHTML='<div class="empty">در حال دریافت…</div>';
 box.scrollIntoView({behavior:'smooth',block:'start'});
 latestRead(id,method,args,(rows,info)=>{
  $(id+'Sub').textContent=title+' — '+fa(rows.length)+' رکورد'+(info?.error?' — نسخهٔ قبلی؛ بروزرسانی ناموفق':info?.refreshing?' — نسخهٔ قبلی؛ در حال بروزرسانی…':'');
  $(id+'Body').innerHTML=rowsTable(rows);makeTableSortable(box);
 },e=>{if(!readRpc.peek(method,args))$(id+'Body').innerHTML='<div class="data-note">'+safe(e?.message||e)+'</div>';else toast('بروزرسانی جزئیات ناموفق بود؛ نتیجهٔ قبلی نمایش داده می‌شود.');},()=>{});
}

const periodInitialLoaded={daily:false,weekly:false,monthly:false,reportMonth:false};
const periodInitialPending={};
function renderInitialPeriod(period,payload,source,requestedFilters){
 const pageId=period+'Page';
 filterOptions.periodCampaign[period]=payload.campaignOptions||[];
 state.data[period]=payload.summary||{};
 if(payload.meta)state.data.meta={...(state.data.meta||{}),...payload.meta};
 periodInitialLoaded[period]=true;
 if(source!=='cached'&&source!=='snapshot')periodReadAt[period]=Date.now();
 renderPeriod(period,pageId,periodTitle(period));
 $(pageId).dataset.initialSource=source;
 bindChartHover($(pageId));
 setPageLoading(pageId,false);
 if(source!=='snapshot'&&source!=='cached'){
  snapshotWrite('period:'+period,payload);
  readRpc.remember('getFilteredPeriodSummary',[period,requestedFilters],payload.summary);
  updateFreshnessBanner(state.data?.meta||{});
 }
}
function loadInitialPeriod(period){
 const pageId=period+'Page';
 if(periodInitialPending[period])return;
 if(periodInitialLoaded[period]){if(Date.now()-(periodReadAt[period]||0)>60000)applyPeriodFilters(period);return;}
 const requestedFilters=JSON.parse(JSON.stringify(filterState[period]));
 const prepared=initialPeriods.read(period,requestedFilters);
 if(prepared){renderInitialPeriod(period,prepared,'preloaded',requestedFilters);return;}
 const stale=initialPeriods.readStale(period,requestedFilters);
 if(stale){renderInitialPeriod(period,stale,'cached',requestedFilters);pageReadNotice(pageId,{refreshing:true,savedAt:Date.parse(stale.meta.generatedAt)});}
 periodInitialPending[period]=true;
 setPageLoading(pageId,!stale);
 google.script.run
  .withFailureHandler(e=>{
    periodInitialPending[period]=false;
    if(JSON.stringify(filterState[period])!==JSON.stringify(requestedFilters))return;
    if(stale){pageReadNotice(pageId,{error:true,savedAt:Date.parse(stale.meta.generatedAt)});return;}
    const snap=snapshotRead('period:'+period);
    if(snap&&validPeriodPayload(snap.payload)){
      renderInitialPeriod(period,snap.payload,'snapshot',requestedFilters);
      healthBanner('danger','اتصال موقتاً در دسترس نیست؛ آخرین Snapshot سالم نمایش داده می‌شود.','ذخیره مرورگر: '+new Date(snap.savedAt).toLocaleString('fa-IR'));
      return;
    }
    setPageLoading(pageId,false);
    toast('خطا در دریافت اطلاعات: '+(e?.message||e||'خطای نامشخص'));
  })
  .withSuccessHandler(payload=>{
    periodInitialPending[period]=false;
    if(JSON.stringify(filterState[period])!==JSON.stringify(requestedFilters))return;
    let source='direct';
    if(!validPeriodPayload(payload)){
      const snap=snapshotRead('period:'+period);
      if(snap&&validPeriodPayload(snap.payload)){
        payload=snap.payload;
        source='snapshot';
        healthBanner('danger','پاسخ نامعتبر Backend دریافت شد؛ آخرین Snapshot سالم نمایش داده می‌شود.','ذخیره مرورگر: '+new Date(snap.savedAt).toLocaleString('fa-IR'));
      }else{
        setPageLoading(pageId,false);
        toast('پاسخ نامعتبر برای '+period);
        return;
      }
    }
    renderInitialPeriod(period,payload,source,requestedFilters);
    pageReadNotice(pageId,null);
  })
  .getPeriodInitialPayload(period,requestedFilters);
}
function switchPage(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));
 document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
 if(id==='dailyPage')loadInitialPeriod('daily');
 if(id==='weeklyPage')loadInitialPeriod('weekly');
 if(id==='monthlyPage')loadInitialPeriod('monthly');
  if(id==='reportMonthPage')loadInitialPeriod('reportMonth');
}
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));

function renderAll(options={}){
 const meta=state.data.meta||{};
 $('lastSyncText').textContent=meta.lastSyncAt?new Date(meta.lastSyncAt).toLocaleString('fa-IR'):'—';
 $('dataVersionText').textContent=meta.dataVersion?String(meta.dataVersion).slice(-16):'—';
 filterOptions.team=state.data.teamFilters||{};
 filterOptions.open=state.data.openFilters||{};
 if(!options.fallback)initialPeriods.seed(state.data.periods);
 renderTeam();
 renderOpen();
 makeTableSortable();
 $('loadingScreen').style.display='none';
 if(options.fallback){
   healthBanner('danger','اتصال موقتاً در دسترس نیست؛ آخرین Snapshot سالم نمایش داده می‌شود.',options.savedAt?'ذخیره مرورگر: '+new Date(options.savedAt).toLocaleString('fa-IR'):'');
 }else{
   updateFreshnessBanner(meta);
 }
}

google.script.run
 .withFailureHandler(e=>{
   const snap=snapshotRead('initial');
   if(snap&&validInitialPayload(snap.payload)){
     state.data=snap.payload;
     renderAll({fallback:true,savedAt:snap.savedAt});
     return;
   }
   document.querySelector('.loading-card p').textContent='خطا در دریافت اطلاعات: '+(e.message||e);
 })
 .withSuccessHandler(data=>{
   if(validInitialPayload(data)){
     const {periods,...initialSnapshot}=data;
     snapshotWrite('initial',initialSnapshot);
     readRpc.remember('getTeamFilteredSummary',[filterState.team],data.team);
     readRpc.remember('getOpenFilteredSummary',[filterState.open],data.open);
     state.data=data;
     renderAll();
     return;
   }
   const snap=snapshotRead('initial');
   if(snap&&validInitialPayload(snap.payload)){
     state.data=snap.payload;
     renderAll({fallback:true,savedAt:snap.savedAt});
     return;
   }
   document.querySelector('.loading-card p').textContent='پاسخ نامعتبر از سرویس داده دریافت شد.';
 })
 .getDashboardInitialPayload(filterState.open);

</script>
